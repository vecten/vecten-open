[project]
name = "vecten-shared"
version = "0.1.0"
description = "Runtime contracts shared by the vecten CLI, platform and MCP packages"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Vecten" }]
keywords = ["vecten", "runtime contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
    "Topic :: Database",
]
dependencies = [
    "packaging>=24,<27",
    "pydantic>=2.9,<3",
    "tomli-w>=1.1,<2",
    "tomlkit>=0.15,<1",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.19,<5",
    "pyyaml>=6.0,<7",
    "sqlglot>=30.22,<30.23",
    "boto3>=1.43,<1.44",
    "certifi>=2024.2.2",
]

[project.urls]
Homepage = "https://github.com/vecten/vecten-open"
Source = "https://github.com/vecten/vecten-open"
Documentation = "https://github.com/vecten/vecten-open/blob/main/docs/README.md"
Issues = "https://github.com/vecten/vecten-open/issues"
Changelog = "https://github.com/vecten/vecten-open/blob/main/CHANGELOG.md"
Security = "https://github.com/vecten/vecten-open/security/policy"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecten_shared"]
