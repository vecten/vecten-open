map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name airflow.data.acme.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name airflow.data.acme.com;
    ssl_certificate /etc/letsencrypt/live/airflow.data.acme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airflow.data.acme.com/privkey.pem;
    location / {
        set $upstream http://airflow-api-server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
