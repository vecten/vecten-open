map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name airflow.localhost;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://airflow.localhost:8443$request_uri; }
}

server {
    listen 80;
    server_name mcp.localhost;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mcp.localhost:8443$request_uri; }
}

server {
    listen 443 ssl;
    server_name airflow.localhost;
    ssl_certificate /etc/nginx/certs/airflow.localhost.crt;
    ssl_certificate_key /etc/nginx/certs/airflow.localhost.key;
    location / {
        set $upstream http://airflow-api-server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name mcp.localhost;
    ssl_certificate /etc/nginx/certs/mcp.localhost.crt;
    ssl_certificate_key /etc/nginx/certs/mcp.localhost.key;
    location / {
        set $upstream http://mcp-server:8001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
