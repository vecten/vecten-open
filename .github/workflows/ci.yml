name: ci
on:
  pull_request:
  push:
    branches: [main, "release/**"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  UV_PYTHON: "3.14"
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: extension contracts and edition boundary in release wheels
        run: |
          uv build --all-packages --wheel --out-dir /tmp/vecten-extension-wheels
          uv build packages/vecten/tests/fixtures/extension --wheel --out-dir /tmp/vecten-extension-wheels
          uv run python scripts/check_extension_wheels.py /tmp/vecten-extension-wheels
      - name: versions table agrees with image build args
        run: |
          expected=$(uv run python -c "import tomllib;print(tomllib.load(open('packages/vecten-shared/src/vecten_shared/versions.toml','rb'))['images']['airflow'])")
          tag=${expected##*:}
          version=${tag%%-*}
          args=$(uv run vecten dev build-images --print --json)
          grep -qF "AIRFLOW_IMAGE=${expected}\"" <<<"$args"
          grep -qF "AIRFLOW_VERSION=${version}\"" <<<"$args"
  test:
    runs-on: ubuntu-24.04
    # The unmarked tests include dbt builds on the Snowflake emulation, each under a minute.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages
      # --shard deals every sixth test to this job, and loadgroup keeps an xdist_group on one
      # worker, as the shard keeps it in one job.
      - run: >-
          uv run pytest -m "not docker and not network and not terraform and not browser and not snowflake_live"
          -q -n auto --dist loadgroup --shard ${{ matrix.shard }}/6
  browser-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The image carries Chromium, WebKit and their system libraries, so the job installs
    # nothing from apt. It holds one Playwright release's browser builds only, so the versions
    # table pins it at the playwright version uv.lock resolves.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages --group browser
      - run: uv run --group browser pytest packages/vecten-mcp/tests/test_oauth_browser.py packages/vecten/tests/test_eval_harness_person_tools.py -q

  render-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages
      - name: Read pinned Terraform version
        id: terraform
        run: echo "version=$(uv run python -c 'from vecten_shared.versions import VERSIONS; print(VERSIONS.terraform)')" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ~${{ steps.terraform.outputs.version }}.0
          terraform_wrapper: false
      # The unmarked tests of these modules run in the test shards. Each terraform test inits
      # its own root and downloads its providers, so the tests wait on the network side by side.
      - run: >-
          uv run pytest packages/vecten/tests/test_terraform_modules.py -m terraform -q -n 4
          --shard ${{ matrix.shard }}/2 --durations=20

  laptop-e2e:
    runs-on: ubuntu-24.04
    # Every part that runs a stack test builds the Airflow base image (about 3 GB) from scratch.
    # pytest's --timeout bounds each test at 40 minutes and is the binding limit: the job limit
    # sits above a part's two longest tests so that a hang fails as a test, with its traceback.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The longest e2e tests each get a runner; every other docker or network test, including
        # any new one, falls to the four `rest` quarters. Each runner has its own ports, so the
        # stack tests, which publish fixed ones, never meet. `images` names the versions-table
        # images the part's tests pull; `build` marks the parts whose tests build the two base
        # images.
        include:
          - part: connector
            build: true
            tests: packages/vecten/tests/test_connector_e2e.py
            images: airflow mcp_base postgres nginx log_cleaner
          - part: pipeline
            build: true
            tests: packages/vecten/tests/test_laptop_pipeline_e2e.py
            images: airflow mcp_base postgres nginx log_cleaner
          - part: up
            build: true
            tests: >-
              packages/vecten/tests/test_up_e2e.py
              packages/vecten/tests/test_services_up_docker.py
              packages/vecten/tests/test_apps_docker.py
            images: airflow mcp_base postgres nginx log_cleaner
          - part: images
            build: true
            tests: >-
              packages/vecten-platform/tests/test_sync_dag_in_image.py
              packages/vecten-platform/tests/test_dbt_dag_in_image.py
              packages/vecten/tests/test_extension_images_docker.py
              packages/vecten/tests/test_component_dependencies_docker.py
              packages/vecten/tests/test_in_repo_images_docker.py
            images: airflow mcp_base
          - part: rest-1
            tests: --shard 1/4 $REST
            images: postgres mcp_base nginx
          - part: rest-2
            tests: --shard 2/4 $REST
            images: postgres mcp_base nginx
          - part: rest-3
            tests: --shard 3/4 $REST
            images: postgres mcp_base nginx
          - part: rest-4
            tests: --shard 4/4 $REST
            images: postgres mcp_base nginx
    env:
      REST: >-
        packages/vecten-shared/tests packages/vecten-mcp/tests
        packages/vecten-platform/tests/test_dbt_local_warehouse.py packages/vecten/tests
        --ignore=packages/vecten/tests/test_connector_e2e.py
        --ignore=packages/vecten/tests/test_laptop_pipeline_e2e.py
        --ignore=packages/vecten/tests/test_up_e2e.py
        --ignore=packages/vecten/tests/test_services_up_docker.py
        --ignore=packages/vecten/tests/test_apps_docker.py
        --ignore=packages/vecten/tests/test_extension_images_docker.py
        --ignore=packages/vecten/tests/test_component_dependencies_docker.py
        --ignore=packages/vecten/tests/test_in_repo_images_docker.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pulls run while uv sets up, and the tests find the images in place.
      - name: Pull the part's images in the background
        run: |
          (
            for image in $(python3 scripts/ci_images.py ${{ matrix.images }}); do
              docker pull -q "$image" &
            done
            wait
            touch "$RUNNER_TEMP/pulled"
          ) > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages
      - run: docker info
      # The build waits on its base image's pull; Docker fetches each layer once for both.
      - name: Build the base images
        if: matrix.build
        run: uv run vecten dev build-images --json
      # A pull that failed here is retried by the test that needs the image.
      - name: Wait for the image pulls
        run: |
          until [ -e "$RUNNER_TEMP/pulled" ]; do sleep 1; done
          cat "$RUNNER_TEMP/pull.log"
      - name: Who holds port 55432
        run: |
          sudo ss -ltnp 'sport = :55432'
          docker ps --format '{{.ID}} {{.Names}} {{.Ports}}'
      - run: uv run pytest -m "docker or network" -q -x --timeout 2400 --durations=20 ${{ matrix.tests }}
      - name: Who holds port 55432 after a failure
        if: failure()
        run: |
          sudo ss -ltnp 'sport = :55432'
          docker ps -a --format '{{.ID}} {{.Names}} {{.Status}} {{.Ports}}'

  # The check the rulesets require of this workflow: a matrix job reports under one name per
  # matrix entry. `always()` makes it run after a failed job, where a skipped check would pass.
  required:
    if: always()
    needs: [lint, test, browser-auth, render-matrix, laptop-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ ! "$RESULTS" =~ failure|cancelled ]]
