name: close-issues
# GitHub closes the issues a pull request names only when it merges into the default branch, and
# work reaches main only with a release. pull_request_target gives a merged pull request from a
# fork a token that can close issues; nothing from the pull request is checked out or run, and
# its body reaches the script through the environment because it is the author's text.
on:
  pull_request_target:
    types: [closed]
    branches: ['release/**']
permissions: {}
jobs:
  close-issues:
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: close the issues the pull request names with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          issues=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' <<<"$BODY" | grep -oE '[0-9]+$' | sort -un || true)
          for issue in $issues; do
            # A closing keyword can name a pull request, which this job must leave alone.
            open=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.pull_request == null and .state == "open"')
            if [[ "$open" == "true" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed \
                --comment "Fixed by #$NUMBER, merged into $BASE."
            fi
          done
