name: publish
on:
  push:
    tags: ["v*"]
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  UV_PYTHON: "3.14"
jobs:
  # Fails, and so stops every later job, unless the tag names the tree's version and a release
  # tag sits on main. A tag name is the pusher's text, so it reaches the script through env.
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.target.outputs.target }}
      index_url: ${{ steps.target.outputs.index_url }}
      check_url: ${{ steps.target.outputs.check_url }}
      version: ${{ steps.target.outputs.version }}
      airflow_image: ${{ steps.target.outputs.airflow_image }}
      airflow_version: ${{ steps.target.outputs.airflow_version }}
      mcp_base_image: ${{ steps.target.outputs.mcp_base_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: target
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_target.py "$TAG"
      # A release whose changelog holds no section for it is refused here, before anything is
      # published. A candidate gets no Release page, so no notes.
      - if: steps.target.outputs.target == 'release'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: python3 scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - if: steps.target.outputs.target == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

  # The `release` environment's required reviewers hold a release here until a maintainer
  # approves; each index trusts this workflow only from its own environment.
  packages:
    needs: target
    if: contains(fromJSON('["candidate", "release"]'), needs.target.outputs.target)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.target.outputs.target }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A publishing job restores no cache, since a run on another ref may have written it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv python install 3.14
      - run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          overwrite: true
      # A rerun skips each file the index already holds, and fails on one that differs from it.
      - env:
          INDEX_URL: ${{ needs.target.outputs.index_url }}
          CHECK_URL: ${{ needs.target.outputs.check_url }}
        run: >-
          uv publish --trusted-publishing always --publish-url "$INDEX_URL"
          --check-url "$CHECK_URL" dist/*

  # This job can write to the registry, so no step of it executes a script, build backend or CLI
  # from the tagged tree: only pinned actions and its own shell, and the image tag comes from the
  # pushed ref, which the App can name only as a candidate. The tree's Dockerfiles (their RUN
  # steps, and the frontend a `# syntax=` line names) still run, inside BuildKit's container,
  # which is not handed the registry credential: reaching it takes an escape from that container.
  # A tag already pushed is never pushed over, since buildx output is not byte-reproducible and a
  # rebuild would change a published digest: before each push the job asks the registry, on
  # every attempt, a rerun of the failed jobs included. The job names no environment, so a
  # release takes one approval: it starts only once the approved packages job has succeeded.
  images:
    needs: [target, packages]
    if: contains(fromJSON('["candidate", "release"]'), needs.target.outputs.target)
    runs-on: ubuntu-24.04
    # The linux/arm64 builds run under QEMU emulation.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'
          if ! [[ $REF_NAME =~ $pattern ]]; then
            echo "refused: the ref $REF_NAME is not vX.Y.Z or vX.Y.ZrcN" >&2
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Exit 0 means the tag exists; only a failure that names this ref as not found means it does
      # not, and any other failure stops the job, so a registry that cannot answer is never read
      # as absent. Both checks share this text and differ only in REF.
      - id: airflow_exists
        shell: bash
        env:
          REF: ghcr.io/vecten/vecten-airflow:${{ steps.version.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "$REF" 2>&1); then
            echo "$REF exists; it is not pushed again"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ $output == *"$REF: not found"* ]]; then
            echo "$REF does not exist; building and pushing it"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused: inspecting $REF failed: $output" >&2
            exit 1
          fi
      # One build per image puts both platforms in one index, so a tag never exists with one
      # platform only; a failed airflow build stops the job before the mcp check. The context
      # is the checkout's path: the action's default git context would pass the job's token to
      # the build as a secret.
      - if: steps.airflow_exists.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/airflow/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vecten/vecten-airflow:${{ steps.version.outputs.version }}
          build-args: |
            AIRFLOW_IMAGE=${{ needs.target.outputs.airflow_image }}
            AIRFLOW_VERSION=${{ needs.target.outputs.airflow_version }}
            VECTEN_VERSION=${{ steps.version.outputs.version }}
      - id: mcp_exists
        shell: bash
        env:
          REF: ghcr.io/vecten/vecten-mcp:${{ steps.version.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "$REF" 2>&1); then
            echo "$REF exists; it is not pushed again"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ $output == *"$REF: not found"* ]]; then
            echo "$REF does not exist; building and pushing it"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused: inspecting $REF failed: $output" >&2
            exit 1
          fi
      - if: steps.mcp_exists.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vecten/vecten-mcp:${{ steps.version.outputs.version }}
          build-args: |
            BASE_IMAGE=${{ needs.target.outputs.mcp_base_image }}
            VECTEN_VERSION=${{ steps.version.outputs.version }}

  verify:
    needs: [target, packages, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # uv takes a pre-release only for a package named with a pre-release pin, so each of the
      # four is named; TestPyPI serves only the vecten packages, PyPI their dependencies.
      - name: Install the published version in a fresh environment
        shell: bash
        env:
          TARGET: ${{ needs.target.outputs.target }}
          CHECK_URL: ${{ needs.target.outputs.check_url }}
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          pins=("vecten==$VERSION" "vecten-shared==$VERSION" "vecten-platform==$VERSION" "vecten-mcp==$VERSION")
          sources=()
          if [ "$TARGET" = candidate ]; then
            for project in vecten vecten-shared vecten-platform vecten-mcp; do
              sources+=(--find-links "${CHECK_URL}${project}/")
            done
          fi
          venv="$RUNNER_TEMP/published"
          uv venv --no-config "$venv"
          deadline=$((SECONDS + 300))
          until uv pip install --no-config --no-cache --python "$venv" "${sources[@]}" "${pins[@]}"; do
            if [ "$SECONDS" -ge "$deadline" ]; then exit 1; fi
            sleep 20
          done
          [ "$("$venv/bin/vecten" version)" = "vecten $VERSION" ]
      - name: Check that both images hold both platforms
        env:
          VERSION: ${{ needs.target.outputs.version }}
        run: '"$RUNNER_TEMP/published/bin/vecten" dev check-images --version "$VERSION"'
      # The index serves its JSON pages from a cache of their own, so a file the install found can
      # still be missing there for a while; a hash that is present and differs fails at once.
      - name: Compare each built file's sha256 with the published one
        shell: bash
        env:
          CHECK_URL: ${{ needs.target.outputs.check_url }}
        run: |
          deadline=$((SECONDS + 300))
          for path in dist/*; do
            file=${path#dist/}
            project=${file%%-*}
            project=${project//_/-}
            built=$(sha256sum "$path" | cut -d " " -f 1)
            until published=$(curl -fsSL -H "Accept: application/vnd.pypi.simple.v1+json" "${CHECK_URL}${project}/" \
              | jq -r --arg file "$file" '.files[] | select(.filename == $file) | .hashes.sha256') \
              && [ -n "$published" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then echo "$file is not on the index"; exit 1; fi
              sleep 20
            done
            echo "$file built $built published $published"
            [ "$built" = "$published" ]
          done

  # The release's GitHub Release page, once verify has installed the published version. The job
  # checks out nothing and runs only a pinned action, gh and its own shell, so the token that can
  # write the repository's contents reaches no script from the tagged tree. A page that exists is
  # left as it is: a rerun neither fails on it nor overwrites notes edited by hand. gh answers
  # "release not found" only for a 404, and any other failure stops the job.
  release-page:
    needs: [target, verify]
    if: needs.target.outputs.target == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          if output=$(gh release view "$TAG" --json tagName 2>&1); then
            echo "the Release for $TAG exists; it is left as it is"
          elif [[ $output == "release not found" ]]; then
            gh release create "$TAG" --verify-tag --title "Vecten Open $VERSION" \
              --notes-file notes/release-notes.md
          else
            echo "refused: looking up the Release for $TAG failed: $output" >&2
            exit 1
          fi
