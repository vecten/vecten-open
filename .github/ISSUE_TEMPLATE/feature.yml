name: Feature request
description: Something vecten should do. A new cloud, warehouse or orchestrator starts here.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where the product stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
